name: Build & Release Extension

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & run tests
        run: npm run typecheck && npm test

      - name: Build Chrome & Firefox MV3 bundles
        run: npm run build

      - name: Package release zip files
        run: |
          mkdir -p release-zips
          (cd dist/chrome-mv3 && zip -r ../../release-zips/hattrick-helper-chrome-mv3.zip .)
          (cd dist/firefox-mv3 && zip -r ../../release-zips/hattrick-helper-firefox-mv3.zip .)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hattrick-helper-bundles
          path: release-zips/*.zip

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-zips/hattrick-helper-chrome-mv3.zip
            release-zips/hattrick-helper-firefox-mv3.zip
          generate_release_notes: true
